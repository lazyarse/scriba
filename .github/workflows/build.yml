name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.10.3

jobs:
  linux:
    name: Linux (x86_64, .deb)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev xvfb dpkg-dev ninja-build python3-venv \
            libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libglib2.0-dev libxcb-cursor0 \
            libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libgl1 libegl1 \
            wget gnupg

      - name: Install Google Chrome (for headless PDF printing)
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Qt ${{ env.QT_VERSION }}
        run: |
          python3 -m venv "$HOME/aqt"
          "$HOME/aqt/bin/pip" install aqtinstall
          "$HOME/aqt/bin/python" -m aqt install-qt linux desktop "${{ env.QT_VERSION }}" linux_gcc_64 \
            -m qtwebengine qtwebchannel qtpositioning -O "$HOME/Qt"

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/${{ env.QT_VERSION }}/gcc_64" \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j4

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure -j4

      - name: Package .deb
        run: cpack --config build/CPackConfig.cmake -G DEB

      - name: Upload .deb
        uses: actions/upload-artifact@v5
        with:
          name: scriba-Linux.deb
          path: scriba-*-Linux.deb
          if-no-files-found: error

  windows:
    name: Windows (x86_64, NSIS installer)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Qt ${{ env.QT_VERSION }}
        run: |
          python -m pip install --user aqtinstall
          python -m aqt install-qt windows desktop "${{ env.QT_VERSION }}" win64_msvc2022_64 -m qtwebengine qtwebchannel qtpositioning -O "$env:RUNNER_TEMP\Qt"
          echo "$env:RUNNER_TEMP\Qt\${{ env.QT_VERSION }}\msvc2022_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ensure NSIS on PATH
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP\Qt\${{ env.QT_VERSION }}\msvc2022_64"

      - name: Build
        run: cmake --build build -j4

      - name: Package NSIS installer
        shell: bash
        run: |
          makensis -VERSION
          cpack --config build/CPackConfig.cmake -G NSIS \
            || { echo "=== NSISOutput.log ==="; cat _CPack_Packages/win64/NSIS/NSISOutput.log 2>/dev/null; echo "=== project.nsi (head) ==="; head -60 _CPack_Packages/win64/NSIS/project.nsi 2>/dev/null; exit 1; }

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: scriba-Windows.exe
          path: scriba-*-win64.exe
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Qt ${{ env.QT_VERSION }}
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install aqtinstall
          "$RUNNER_TEMP/aqt/bin/python" -m aqt install-qt mac desktop "${{ env.QT_VERSION }}" clang_64 \
            -m qtwebengine qtwebchannel qtpositioning -O "$HOME/Qt"

      - name: Generate app icon (.icns)
        run: bash scripts/make-macos-icon.sh

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/${{ env.QT_VERSION }}/macos" \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

      - name: Build
        run: cmake --build build -j4

      - name: Smoke test
        run: |
          ./build/scriba.app/Contents/MacOS/scriba &
          APP_PID=$!
          sleep 8
          if kill -0 "$APP_PID" 2>/dev/null; then
            kill "$APP_PID"
            echo "smoke OK"
          else
            echo "app exited before smoke window" >&2
            exit 1
          fi

      - name: Deploy bundle and build .dmg
        run: |
          VERSION="$(git describe --tags --always | sed 's/^v//')"
          ARCH="${{ matrix.arch }}"
          if [ "$ARCH" = "x86_64" ]; then FAMILY="Intel"; else FAMILY="AppleSilicon"; fi
          cmake --install build --prefix "$RUNNER_TEMP/stage"
          "$HOME/Qt/${{ env.QT_VERSION }}/macos/bin/macdeployqt" "$RUNNER_TEMP/stage/scriba.app" \
            -codesign=- -always-overwrite
          hdiutil create -volname Scriba -srcfolder "$RUNNER_TEMP/stage/scriba.app" \
            -ov -format UDZO "$RUNNER_TEMP/scriba-${VERSION}-macOS-${FAMILY}.dmg"

      - name: Upload .dmg
        uses: actions/upload-artifact@v5
        with:
          name: scriba-macOS-${{ matrix.arch }}.dmg
          path: ${{ runner.temp }}/scriba-*-macOS-*.dmg
          if-no-files-found: error
